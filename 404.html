<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới – Trọng Vũ &amp; Hồng Nhung</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://vunhungwedding.online/">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f4f2ea; color: #707070; font-family: Lora, Georgia, 'Times New Roman', serif; }
    .box { text-align: center; padding: 24px; }
    a { color: #7f0505; }
  </style>
  <script>
    /* GitHub Pages serves this file for every path it cannot resolve (e.g. /groom/evening).
       The invitation itself lives in index.html, so hand the guest + time group over to it
       as ?g=&t= and let index.html's parsePath() apply the data and normalize the URL. */
    (function () {
      var GUEST = { bride: 1, groom: 1 };
      var GROUP = { evening: 1, morning: 1 };

      function read(parts, index, allowed) {
        var v = decodeURIComponent(String(parts[index] || '')).toLowerCase();
        return allowed[v] ? v : '';
      }

      var path = String(location.pathname || '').replace(/\/+$/, '').split('/').filter(Boolean);
      if (path[0] === 'index.html' || path[0] === '404.html') path = [];

      var guest = read(path, 0, GUEST);
      var group = read(path, 1, GROUP);

      location.replace((guest && group) ? '/?g=' + guest + '&t=' + group : '/');
    })();
  </script>
</head>
<body>
  <div class="box">
    <p>Đang chuyển tới thiệp cưới…</p>
    <noscript>
      <p>Vui lòng bật JavaScript, hoặc <a href="/">mở thiệp cưới tại đây</a>.</p>
    </noscript>
    <p><a href="/">Mở thiệp cưới</a></p>
  </div>
</body>
</html>
